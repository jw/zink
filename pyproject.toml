[project]
name = "zink"
version = "4.0.0"
description = "The elevenbits website"
authors = [{ name = "Jan Willems", email = "jan.willems@elevenbits.com" }]
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "django>=6.1.1,<6.2",
    "python-dotenv>=1.2.3",
    "dj-database-url>=3.1.2",
    "psycopg2-binary>=2.9.12",
    "whitenoise[brotli]>=6.12.0",
    "gunicorn==26.2.0",
    "django-treenode==0.21.0",
    "pillow==12.3.0",
    "pygments==2.21.0",
    "uvicorn==0.52.4",
    "markdown==3.10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foo"]

[tool.isort]
# Without this, isort's default 79-char line length disagrees with black's 88-char
# default, so the two hooks can fight over how to wrap any import line in between
# (isort wraps it, black unwraps it, forever) - see
# https://pycqa.github.io/isort/docs/configuration/black_compatibility.html
profile = "black"
