{% load static %}
{% load version %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ElevenBits</title>

    <!-- Meta SEO -->
    <meta name="title" content="ElevenBits">
    <meta name="description" content="ElevenBits">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="language" content="English">
    <meta name="author" content="Jan Willems <jw@elevenbits.com>">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/code.css' %}">

</head>

<body>

    <header class="border-bottom">
        <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3 py-3">
            <a href="{% url 'index' %}" class="d-flex align-items-center gap-2 text-body text-decoration-none">
                <img src="{% static 'logo.png' %}" alt="" height="32">
                <span class="fs-5 fw-bold text-uppercase">elevenbits</span>
            </a>
            <nav>
                <ul class="nav gap-1">
                    <li class="nav-item">
                        <a class="nav-link{% if request.path == '/' %} fw-bold{% endif %}" href="{% url 'index' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.resolver_match.url_name == 'projects' %} fw-bold{% endif %}" href="{% url 'projects' %}">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.resolver_match.app_name == 'blog' %} fw-bold{% endif %}" href="{% url 'blog:blog' %}">Blog</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.resolver_match.url_name == 'contact' %} fw-bold{% endif %}" href="{% url 'contact' %}">Contact</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container py-4">
        {% block content %}
        {% endblock content %}
    </div>

    {% block footer %}
        <footer class="text-center py-4 bg-light border-top">
            <div>
                <a href="/">
                    Running on Python {% version 'python' %} and Django {% version 'Django' %}.
                </a>
            </div>
            <div>
                <div>
                    <a href="/about">About</a>
                    <a href="/cookies">Cookies</a>
                </div>
            </div>
        </footer>
    {% endblock %}

</body>

</html>
