    "dj-database-url>=2.1.0,<3",
    "psycopg2-binary>=2.9.5,<3",
    "whitenoise[brotli]>=6.4.0,<7",
    "gunicorn>=21.2.0,<22",
    "django-treenode>=0.21.0,<0.22",
